syntax = "proto3";

package cafecito.game.v1;

import "inventory.proto";

// Lifecycle state of a player session.
enum PlayerStatus {
  PLAYER_STATUS_UNSPECIFIED = 0;
  PLAYER_STATUS_ONLINE = 1;
}

// An equippable inventory slot.
message Slot {
  string label = 1;
  int32 quantity = 2;
}

// Player state shared with Foundry Script.
message Player {
  // Player display name.
  string name = 1;

  // Current progression level.
  int32 level = 2;

  bool active = 3;
  bytes avatar = 4;

  // Explicit presence: an empty nickname differs from an absent one.
  optional string nickname = 5;

  repeated string tags = 6;
  repeated int32 scores = 7;

  PlayerStatus status = 8;
  Slot primary = 9;
  repeated Slot slots = 10;

  map<string, int32> counts = 11;
  map<string, Slot> loadout = 16;

  oneof payload {
    string text = 12;
    int32 amount = 13;

    // Payloads declared inside the very message that declares the oneof. The
    // union is hoisted to file level, so it reaches them through the class.
    Badge chosen_badge = 23;
    Tier chosen_tier = 24;
  }

  message Badge {
    string code = 1;
  }

  enum Tier {
    TIER_UNSPECIFIED = 0;
    TIER_GOLD = 1;
  }

  Badge badge = 14;
  Tier tier = 15;

  // Cross-file references: both the message and the enum are declared in
  // another package, so the binding has to import that namespace.
  cafecito.inventory.v1.Item held = 17;
  cafecito.inventory.v1.Rarity rarity = 18;

  // Names that collide with the emitter's own locals or with a Foundry Script
  // keyword. The binding has to keep working and keep the field readable.
  int32 offset = 19;
  string data = 20;
  bytes result = 21;
  int32 var = 22;
}
