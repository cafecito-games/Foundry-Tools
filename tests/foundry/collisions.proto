syntax = "proto3";

package probe.collisions.v1;

import "collision_dependency.proto";

option (foundrytools.type_prefix) = "Game";

enum String {
  STRING_UNSPECIFIED = 0;
  STRING_READY = 1;
}

message Node {
  message Timer {
    string label = 1;
  }

  Timer nested = 1;
  probe.dependency.v1.Timer imported = 2;
  String state = 3;

  oneof payload {
    string text = 4;
    int32 amount = 5;
  }

  string Node = 6;
  string String = 7;
  repeated string Timer = 8;
  map<string, int32> Resource = 9;

  oneof Object {
    string Image = 10;
    int32 count = 11;
  }
}
